apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: https

  hostnames:
    - grafana.lab.korvintech.cloud

  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
