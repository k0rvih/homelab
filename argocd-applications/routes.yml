apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: routes
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/k0rvih/homelab.git
    targetRevision: main
    path: routes

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true