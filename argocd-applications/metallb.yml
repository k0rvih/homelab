apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        releaseName: metallb
        valueFiles:
          - $values/metallb/values.yml

    - repoURL: https://github.com/k0rvih/homelab.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/k0rvih/homelab.git
      targetRevision: main
      path: metallb/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
